{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - CareerHub AI</title>

    <link rel="stylesheet" href="{% static 'style.css' %}">

</head>

<body>

<div class="auth-page">

    <div class="auth-box">

        <div class="auth-logo">
            Career<span>Hub AI</span>
        </div>

        <h2>
            Welcome Back 👋
        </h2>

        <p class="auth-subtitle">
            Login to continue to your account
        </p>


        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter username"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >

            </div>


            <button type="submit" class="auth-submit">
                Login →
            </button>

        </form>


        <div class="auth-link">

            Don't have an account?

            <a href="{% url 'register' %}">
                Create Account
            </a>

        </div>


        <a href="{% url 'home' %}" class="back-home">
            ← Back to Home
        </a>

    </div>

</div>

</body>
</html>
